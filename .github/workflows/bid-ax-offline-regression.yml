name: BID AX offline Windows/Linux regression (nonrelease)
on:
  push:
    branches:
      - product/bid-ax-public-procurement
    paths:
      - "bidax/**"
      - "tests/**"
      - "packaging/**"
      - "run_bidax.py"
      - ".github/workflows/bid-ax-offline-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bidax-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-suite:
    if: github.ref == 'refs/heads/product/bid-ax-public-procurement'
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional PDF test dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0
      - name: Compile
        run: python -m compileall -q bidax tests packaging run_bidax.py
      - name: All offline tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Build unreleased Python zipapp
        run: python packaging/build_portable.py BIDAX_CI_UNRELEASED.pyz
      - name: Zipapp smoke
        run: python BIDAX_CI_UNRELEASED.pyz --help
  windows-exe:
    if: github.ref == 'refs/heads/product/bid-ax-public-procurement'
    name: Windows unsigned test-only EXE smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install temporary builder
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6,<7"
      - name: Build test console EXE with lazy imports
        run: python -m PyInstaller --noconfirm --clean --onefile --console --collect-submodules bidax --name BIDAX_CI_UNRELEASED --paths . run_bidax.py
      - name: Check executable startup and no-network plan (bounded)
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\BIDAX_CI_UNRELEASED.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '--help' -RedirectStandardOutput ".\ci-help.txt" -WorkingDirectory $PWD.Path -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw 'Windows EXE startup exceeded 90 sec' }
          if ($p.ExitCode -ne 0) { throw 'Windows EXE help failed' }
          $arg = @('--db', '.\ci-local.db', 'api-probe', 'onbid_result_list', '.\examples\onbid_result_list_plan_LOCAL_ONLY.json')
          $q = Start-Process -FilePath $exe -ArgumentList $arg -RedirectStandardOutput ".\ci-plan.json" -WorkingDirectory $PWD.Path -PassThru
          if (-not $q.WaitForExit(90000)) { Stop-Process -Id $q.Id -Force; throw 'Windows EXE API plan exceeded 90 sec' }
          if ($q.ExitCode -ne 0) { throw 'Windows EXE offline plan failed' }
          python -c "import json; x=json.load(open('ci-plan.json')); assert x['ready'] and x['dataset_id']==15157252"
      # No artifact upload or API credentials; this is NOT a signed Windows release.
