name: AX Dev Factory Windows standalone EXE preview
on:
  push:
    branches:
      - feature/axdev-owner-product-ui-20261117
    paths:
      - 'axdev/**'
      - 'scripts/**'
      - 'tests/**'
      - 'BUILD_AXDEV_EXE.cmd'
      - 'RUN_AXDEV_DESKTOP.cmd'
      - '.github/workflows/axdev-desktop-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and command approval regression
        run: |
          python -m compileall -q axdev scripts tests
          python -m unittest tests.test_axdev_desktop -v
      - name: Build unsigned onefile EXE with pinned PyInstaller
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AXDevFactory --paths . --collect-submodules axdev --collect-submodules scripts scripts/axdev_desktop.py
      - name: Packaged executable selfcheck
        shell: powershell
        run: |
          if (!(Test-Path dist/AXDevFactory.exe)) { throw "No Windows EXE produced" }
          $binary = (Resolve-Path .\dist\AXDevFactory.exe).Path
          $process = Start-Process -FilePath $binary -ArgumentList '--axdev-selfcheck' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged import selfcheck failed: $($process.ExitCode)" }
          $exe = Get-Item dist/AXDevFactory.exe
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Output "AXDEV_UNSIGNED_EXE_SHA256=$sha"
          Write-Output "AXDEV_UNSIGNED_EXE_BYTES=$($exe.Length)"
      - name: Upload temporary unsigned developer preview only
        uses: actions/upload-artifact@v4
        with:
          name: AXDevFactory-unsigned-windows11-preview
          path: dist/AXDevFactory.exe
          if-no-files-found: error
          retention-days: 7
