name: CITEVAULT P50-P70 pinned RAG integration
on:
  push:
    branches: [product/rag-enterprise-knowledge]
    paths:
      - enterprise/p50-gate.mjs
      - tests/p50.test.mjs
      - enterprise/p70-policy.mjs
      - tests/p70.test.mjs
      - enterprise/p70-rag-bridge.mjs
      - tests/p70-rag-integration.test.mjs
      - enterprise/p70-citation-contract.mjs
      - tests/p70-citation-contract.test.mjs
      - enterprise/p70-local-review.mjs
      - tests/p70-local-review.test.mjs
      - enterprise/p85-vault.mjs
      - enterprise/p85-conversation.mjs
      - tests/p85-conversation.test.mjs
      - scripts/p85-portable-build.mjs
      - scripts/p85-portable-zip.py
      - tests/p85-portable.test.mjs
      - tests/p85-bm25.test.mjs
      - enterprise/p85-bm25.mjs
      - scripts/p85-operator-demo.mjs
      - tests/p85-operator-ui.test.mjs
      - tests/p85-library.test.mjs
      - tests/p85-browser-e2e.test.mjs
      - tests/p85-operator-users.test.mjs
      - enterprise/p85-ui.mjs
      - enterprise/p85-native-extract.mjs
      - tests/p85-journey.test.mjs
      - scripts/p85-synthetic-demo.mjs
      - enterprise/p85-journey.mjs
      - enterprise/p85-review-sql.mjs
      - tests/p85-signed-journey.test.mjs
      - enterprise/p85-signed-review-gate.mjs
      - enterprise/p85-native-extract.py
      - tests/p85-native-fixture.py
      - tests/p85-native-integration.test.mjs
      - tests/requirements-p85-native.txt
      - tests/p85-vault.test.mjs
      - enterprise/p85-loopback.mjs
      - tests/p85-loopback.test.mjs
      - tests/p85-state-store.test.mjs
      - enterprise/p85-signed-provenance.mjs
      - tests/p85-signed-provenance.test.mjs
      - enterprise/p85-state-store.mjs
      - enterprise/p85-offline-backup.mjs
      - tests/p85-offline-backup.test.mjs
      - tests/p85-synthetic100.test.mjs
      - scripts/p85-offline-ops.mjs
      - .github/workflows/citevault-p50.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout CITEVAULT code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 local contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact-source local citation and PREP-SMAX review-only contracts
        run: node --test tests/p70-citation-contract.test.mjs tests/p70-local-review.test.mjs
  p85-loopback-contracts:
    name: P85 local vault and HTTP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
          - os: windows-2022
            node: '22.23.0'
    steps:
      - name: Checkout CITEVAULT product branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate P85 source and HTTP syntax
        shell: bash
        run: |
          node --check enterprise/p85-vault.mjs
          node --check enterprise/p85-conversation.mjs
          node --check enterprise/p85-loopback.mjs
          node --check enterprise/p85-state-store.mjs
          node --check enterprise/p85-signed-provenance.mjs
          node --check enterprise/p85-ui.mjs
          node --check enterprise/p85-bm25.mjs
          node --check enterprise/p85-signed-review-gate.mjs
          node --check enterprise/p85-review-sql.mjs
          node --check enterprise/p85-journey.mjs
          node --check scripts/p85-operator-demo.mjs
      - name: Run real local credentials, tenant isolation and lifecycle regression
        run: node --test tests/p85-vault.test.mjs tests/p85-loopback.test.mjs tests/p85-state-store.test.mjs tests/p85-signed-provenance.test.mjs tests/p85-operator-users.test.mjs tests/p85-operator-ui.test.mjs tests/p85-bm25.test.mjs tests/p85-signed-journey.test.mjs tests/p85-library.test.mjs tests/p85-conversation.test.mjs
      - name: Validate 100 synthetic Korean search and access cases with latency evidence
        run: node --test tests/p85-synthetic100.test.mjs
      - name: Test opt-in offline SQLite backup and create-only restore
        run: node --test tests/p85-offline-backup.test.mjs
      - name: Verify offline operator login, UI, scoped search and revocation
        run: node scripts/p85-operator-demo.mjs --self-test
  p85-native-evidence:
    name: P85 actual PDF/DOCX native citations / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.16.0'
          - os: windows-2022
            node: '22.23.0'
    steps:
      - name: Checkout enterprise synthetic-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local PDF/DOCX parser and test fixture dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements-p85-native.txt
      - name: Validate source before executing offline tests
        run: |
          node --check enterprise/p85-native-extract.mjs
          node --check enterprise/p85-review-sql.mjs
          node --check enterprise/p85-journey.mjs
      - name: Run actual PDF page, DOCX paragraph, ACL-before-read and SHA tests
        run: node --test tests/p85-native-integration.test.mjs tests/p85-journey.test.mjs
      - name: Run isolated synthetic end-to-end HTTP demo (never approves export)
        run: node scripts/p85-synthetic-demo.mjs --self-test
  p85-windows-portable-qa:
    name: Windows2022 Node22 offline portable ZIP unpack and self-test
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact CITEVAULT product source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pinned Node22 local runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Setup Python for deterministic standard-library ZIP
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate no-external-call synthetic portable ZIP build/restore/execution
        run: node --test tests/p85-portable.test.mjs
  p85-browser-render:
    name: Actual Chromium rendered desktop/mobile CITEVAULT UI / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact CITEVAULT code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22 with native CDP WebSocket
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate actual Chrome UI login, authorized document KPI, source search, mobile viewport, logout
        run: node --test tests/p85-browser-e2e.test.mjs
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout CITEVAULT product branch
        uses: actions/checkout@v4
        with:
          path: citevault
          persist-credentials: false
      - name: Checkout pinned public RAG source (read-only)
        uses: actions/checkout@v4
        with:
          repository: hibi89/RAG_STUDIO
          ref: c5867b3951f51bfa97cadd1aad8fb13e9cf9e604
          path: rag
          persist-credentials: false
      - name: Node 22 for built-in SQLite
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify pinned RAG commit
        shell: bash
        run: test "$(git -C rag rev-parse HEAD)" = "c5867b3951f51bfa97cadd1aad8fb13e9cf9e604"
      - name: Install exact pinned RAG native document dependencies
        shell: bash
        working-directory: rag
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate original PDF/DOCX page and paragraph citations
        shell: bash
        working-directory: rag
        run: node --test tests/p512-native-document.test.mjs
      - name: Validate pinned RAG multi-native document, full-corpus conflict and PREP-SMAX review-hold
        shell: bash
        working-directory: rag
        run: node --test tests/p538-full-corpus-conflict.test.mjs tests/p540-native-collection.test.mjs tests/p549-prep-smax-boundary.test.mjs
      - name: Run CITEVAULT source-bound synthetic regression
        shell: bash
        working-directory: citevault
        env:
          RAG_STUDIO_ROOT: ${{ github.workspace }}/rag
        run: node --test tests/p50.test.mjs tests/p70.test.mjs tests/p70-rag-integration.test.mjs
