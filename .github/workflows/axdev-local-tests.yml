name: AX Dev Factory synthetic tests
on:
  push:
    branches:
      - tools/ax-dev-factory-local
    paths:
      - 'axdev/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.opencode/**'
      - 'examples/**'
      - 'RUN_*.cmd'
      - '.github/workflows/axdev-local-tests.yml'
      - 'AGENTS.md'
      - 'REQUIREMENTS.md'
  pull_request:
    branches:
      - tools/ax-dev-factory-local
    paths:
      - 'axdev/**'
      - 'tests/**'
      - 'config/opencode-local-only.json'
      - '.github/workflows/axdev-local-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axdev-python:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python bytecode compilation
        run: python -m compileall -q axdev scripts tests
      - name: Synthetic Git worktree review tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI doctor
        run: python -m axdev doctor --plan examples/sample-plan.json
      - name: CLI version
        run: python -m axdev --version
      # Public anonymous GitHub API is shared-rate-limited on CI runner IPs.
      # Manual canary remains available; keep synthetic correctness gating on push.
      - name: Public GitHub SHA-pinned live read-only import (manual canary)
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          python -m axdev sync-plan --source hibi89/Freelancer --branch tools/ax-dev-factory-local --path examples/sample-plan.json --expected-sha "$APPROVED_SHA" --output "$RUNNER_TEMP/axdev-approved-plan.json"
          python -m axdev sync-plan --source hibi89/Freelancer --branch tools/ax-dev-factory-local --path examples/sample-plan.json --expected-sha "$APPROVED_SHA" --output "$RUNNER_TEMP/axdev-approved-plan.json"
          python -m axdev doctor --plan "$RUNNER_TEMP/axdev-approved-plan.json"

      - name: Disposable fixture generator and no-model dry-run
        run: |
          python scripts/prepare_trial.py --output /tmp/axdev-ci-trial
          python -m axdev run --repo /tmp/axdev-ci-trial/trial-repo --plan /tmp/axdev-ci-trial/trial-plan.json --state /tmp/axdev-ci-trial/state

  axdev-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows-native synthetic Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Windows CMD disposable fixture and independent ready gate (no AI)
        shell: cmd
        run: |
          call RUN_TRIAL.cmd
          if errorlevel 1 exit /b 1
          python -m scripts.verify_trial --phase ready --trial "%USERPROFILE%\AXDEV_TRIAL"
          if errorlevel 1 exit /b 1
          python -m scripts.first_use_evidence --trial "%USERPROFILE%\AXDEV_TRIAL" --output "%RUNNER_TEMP%\axdev-trial-evidence.json"
          if errorlevel 1 exit /b 1
