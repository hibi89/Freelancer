name: AX Dev Factory synthetic tests
on:
  push:
    branches:
      - tools/ax-dev-factory-local
    paths:
      - 'axdev/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.opencode/**'
      - 'examples/**'
      - 'RUN_*.cmd'
      - '.github/workflows/axdev-local-tests.yml'
      - 'AGENTS.md'
      - 'REQUIREMENTS.md'
  pull_request:
    branches:
      - tools/ax-dev-factory-local
    paths:
      - 'axdev/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'RUN_*.cmd'
      - '.github/workflows/axdev-local-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axdev-python:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python bytecode compilation
        run: python -m compileall -q axdev scripts tests
      - name: Synthetic Git worktree review tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI doctor
        run: python -m axdev doctor --plan examples/sample-plan.json
      - name: CLI version
        run: python -m axdev --version
      # Public anonymous GitHub API is shared-rate-limited on CI runner IPs.
      # Manual canary remains available; keep synthetic correctness gating on push.
      - name: Public GitHub SHA-pinned live read-only import (manual canary)
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          python -m axdev sync-plan --source hibi89/Freelancer --branch tools/ax-dev-factory-local --path examples/sample-plan.json --expected-sha "$APPROVED_SHA" --output "$RUNNER_TEMP/axdev-approved-plan.json"
          python -m axdev sync-plan --source hibi89/Freelancer --branch tools/ax-dev-factory-local --path examples/sample-plan.json --expected-sha "$APPROVED_SHA" --output "$RUNNER_TEMP/axdev-approved-plan.json"
          python -m axdev doctor --plan "$RUNNER_TEMP/axdev-approved-plan.json"

      - name: Disposable fixture generator and no-model dry-run
        run: |
          python scripts/prepare_trial.py --output /tmp/axdev-ci-trial
          python -m axdev run --repo /tmp/axdev-ci-trial/trial-repo --plan /tmp/axdev-ci-trial/trial-plan.json --state /tmp/axdev-ci-trial/state

  axdev-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows-native synthetic Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Windows CMD disposable fixture and independent ready gate (no AI)
        shell: cmd
        run: |
          call RUN_TRIAL.cmd
          if errorlevel 1 exit /b 1
          python -m scripts.verify_trial --phase ready --trial "%USERPROFILE%\AXDEV_TRIAL"
          if errorlevel 1 exit /b 1
          python -m scripts.first_use_evidence --trial "%USERPROFILE%\AXDEV_TRIAL" --output "%RUNNER_TEMP%\axdev-trial-evidence.json"
          if errorlevel 1 exit /b 1
      - name: Verify owner startup with a disposable hosted queue
        shell: powershell
        run: |
          $axFixture = Join-Path $env:RUNNER_TEMP 'AXDEV startup fixture'
          $axEngine = Join-Path $axFixture 'fixture engine'
          New-Item -ItemType Directory -Path (Join-Path $axEngine 'axdev'), (Join-Path $axEngine 'scripts') | Out-Null
          New-Item -ItemType File -Path (Join-Path $axEngine 'axdev/core.py'), (Join-Path $axEngine 'scripts/__init__.py') | Out-Null
          $axSettings = Join-Path $axFixture 'settings.json'
          $axDefinition = Join-Path $axFixture 'owner task.xml'
          Set-Content -LiteralPath $axSettings '{}'
          @'
          import json
          import sys
          from pathlib import Path
          marker = Path(sys.argv[2]).with_name('scheduled.json')
          temporary = marker.with_suffix('.tmp')
          temporary.write_text(json.dumps(sys.argv[1:]), encoding='utf-8')
          temporary.replace(marker)
          '@ | Set-Content -LiteralPath (Join-Path $axEngine 'scripts/run_configured_queue.py') -Encoding Ascii
          python -m scripts.prepare_startup --repo $axEngine --settings $axSettings --output $axDefinition --max-tasks 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $axScheduler = New-Object -ComObject 'Schedule.Service'
          $axScheduler.Connect()
          $axFolder = $axScheduler.GetFolder('\')
          $axUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $axTaskName = 'AXDevFactoryFixture-' + [Guid]::NewGuid().ToString('N')
          $axXml = [IO.File]::ReadAllText($axDefinition)
          [void]$axFolder.RegisterTask($axTaskName, $axXml, 1, $axUser, $null, 3, $null)
          Write-Output 'Owner startup template accepted by native Windows Task Scheduler validation'
          if ([Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            Write-Output 'Hosted scheduler launch NOT_RUN because the runner has a non-interactive session'
            return
          }
          $axTask = $axFolder.RegisterTask($axTaskName, $axXml, 2, $axUser, $null, 3, $null)
          try {
            [void]$axTask.Run($null)
            $axMarker = Join-Path $axFixture 'scheduled.json'
            $axDeadline = [DateTime]::UtcNow.AddSeconds(20)
            while (!(Test-Path -LiteralPath $axMarker) -and [DateTime]::UtcNow -lt $axDeadline) {
              Start-Sleep -Milliseconds 250
            }
            if (!(Test-Path -LiteralPath $axMarker)) { throw 'Hosted task did not invoke the disposable queue' }
            $axObserved = Get-Content -LiteralPath $axMarker -Raw | ConvertFrom-Json
            $axExpected = @('--settings', $axSettings, '--max-tasks', '7', '--execute')
            if (($axObserved -join '|') -cne ($axExpected -join '|')) { throw 'Unexpected hosted task arguments' }
            Write-Output 'Hosted scheduler invoked the disposable queue with the approved arguments'
          } finally {
            $axFolder.DeleteTask($axTaskName, 0)
          }
