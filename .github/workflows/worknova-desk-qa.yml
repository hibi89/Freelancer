name: WORKNOVA Desk isolated QA

on:
  push:
    branches:
      - product/worknova-desk-local
    paths:
      - .github/workflows/worknova-desk-qa.yml
      - worknova_desk/**
      - tests/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worknova-desk-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-business-lifecycle:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
      WORKNOVA_TEST_OFFLINE_ONLY: "1"
    steps:
      - name: Check out exact product branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional AES-GCM regression dependency
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.3 python-docx==1.2.0
      - name: Verify synthetic quote through collection lifecycle
        run: python -m unittest discover -s tests -p test_unattended_business_lifecycle.py -v
      - name: Native Windows offline install rollback backup and Tk acceptance (11 checks)
        if: runner.os == 'Windows'
        run: python -B tools/windows_acceptance.py
      - name: Run entire Python regression suite (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run entire Python regression suite under Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi

  native-exe-build:
    name: Windows / reproducible unsigned EXE candidate
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - name: Check out exact product branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned free open-source build dependency
        run: python -m pip install --disable-pip-version-check --no-input pyinstaller==6.22.3
      - name: Build candidate into disposable runner folder
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP ("worknova-qa-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          python -B tools/windows_build_exe.py --out $destination --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/windows_build_exe.py --out $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $destination "dist/WORKNOVA-Desk/WORKNOVA-Desk.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "EXE missing" }
          $item = Get-Item -LiteralPath $exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host ("Unsigned candidate only / bytes=" + $item.Length + " / SHA256=" + $hash + " / RELEASE HOLD")
          # Deliberately do not upload any binary, cache, build.log, or artifacts.
      - name: Smoke-test actual EXE GUI and synthetic SQLite using only temporary profile
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP ("worknova-qa-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $exe = Join-Path $destination "dist/WORKNOVA-Desk/WORKNOVA-Desk.exe"
          python -B tools/windows_exe_smoke.py --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
